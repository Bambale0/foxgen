name: Reference memory format once

on:
  push:
    branches:
      - agent/reference-memory

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Format changed Python files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then
            ruff format "${files[@]}"
          fi
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'style: apply ruff format to reference memory'
          git push origin HEAD:agent/reference-memory
