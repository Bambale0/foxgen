name: Temporary Ruff Telegram copy

on:
  push:
    branches:
      - fix/telegram-screen-copy-20260910

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/telegram-screen-copy-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Ruff autofix
        run: |
          python -m pip install --quiet ruff
          ruff check --fix scripts/apply_happyfox_product_copy.py scripts/apply_happyfox_telegram_screen_copy.py tests/test_happyfox_telegram_screen_copy.py
          ruff format scripts/apply_happyfox_product_copy.py scripts/apply_happyfox_telegram_screen_copy.py tests/test_happyfox_telegram_screen_copy.py
          python -m py_compile scripts/apply_happyfox_product_copy.py scripts/apply_happyfox_telegram_screen_copy.py tests/test_happyfox_telegram_screen_copy.py
          git rm .github/workflows/tmp-ruff-telegram-copy.yml
      - name: Commit clean fix
        run: |
          git config user.name "HappyFox CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(copy): satisfy Telegram copy Ruff gate"
          git push origin HEAD:fix/telegram-screen-copy-20260910
