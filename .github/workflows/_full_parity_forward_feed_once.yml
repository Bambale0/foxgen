name: Full parity forward-port feed once

on:
  push:
    branches:
      - agent/full-miniapp-parity

permissions:
  contents: write

jobs:
  forward-port-feed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fetch source branch
        run: git fetch origin agent/feed-profile-remix-current-main
      - name: Apply feed domain delta onto current main
        shell: bash
        run: |
          set -euo pipefail
          files=(
            migrations/env.py
            migrations/versions/20260814_0009_publication_feed.py
            src/foxgen/api/app.py
            src/foxgen/api/publication_media.py
            src/foxgen/api/publications.py
            src/foxgen/application/submissions.py
            src/foxgen/bot/api_client.py
            src/foxgen/bot/app.py
            src/foxgen/bot/feed.py
            src/foxgen/bot/feed_publish.py
            src/foxgen/bot/feed_remix.py
            src/foxgen/bot/keyboards.py
            src/foxgen/bot/states.py
            src/foxgen/domain/publications.py
            src/foxgen/infra/publication_models.py
            src/foxgen/infra/publications.py
            src/foxgen/infra/repositories.py
            tests/integration/test_publications.py
            tests/test_admin_extension_wiring.py
            tests/test_app_recovery.py
            tests/test_feed_contract.py
            tests/test_submission_security.py
            tests/test_submission_service.py
          )
          git diff --binary 24e6ac7c036133ec9e0078c907c18d00b036e7c3..origin/agent/feed-profile-remix-current-main -- "${files[@]}" > /tmp/feed.patch
          set +e
          git apply --3way --index /tmp/feed.patch
          apply_rc=$?
          set -e
          if [ "$apply_rc" -ne 0 ]; then
            conflicts=(
              src/foxgen/api/app.py
              src/foxgen/bot/app.py
              src/foxgen/bot/keyboards.py
              src/foxgen/bot/states.py
              tests/test_admin_extension_wiring.py
            )
            actual="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' "${conflicts[@]}" | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected conflict set"
              echo "$actual"
              exit 1
            fi
            git checkout --ours -- "${conflicts[@]}"
            git add "${conflicts[@]}"
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # FastAPI runtime: preserve current Mini App wiring and add publication domain.
          replace_once(
              'src/foxgen/api/app.py',
              'from foxgen.api.miniapp import MiniAppRepositoryProtocol, create_miniapp_router\nfrom foxgen.api.security',
              'from foxgen.api.miniapp import MiniAppRepositoryProtocol, create_miniapp_router\nfrom foxgen.api.publication_media import create_publication_media_router\nfrom foxgen.api.publications import PublicationServiceProtocol, create_publication_router\nfrom foxgen.api.security',
          )
          replace_once(
              'src/foxgen/api/app.py',
              'from foxgen.infra.miniapp import SqlAlchemyMiniAppRepository\nfrom foxgen.infra.rate_limit',
              'from foxgen.infra.miniapp import SqlAlchemyMiniAppRepository\nfrom foxgen.infra.publications import SqlAlchemyPublicationRepository\nfrom foxgen.infra.rate_limit',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '        idempotency_key: str,\n    ) -> SubmissionReceipt: ...',
              '        idempotency_key: str,\n        source_publication_id: UUID | None = None,\n    ) -> SubmissionReceipt: ...',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '    miniapp_repository: MiniAppRepositoryProtocol | None = None,\n    admin_services: AdminServices | None = None,',
              '    miniapp_repository: MiniAppRepositoryProtocol | None = None,\n    publication_service: PublicationServiceProtocol | None = None,\n    admin_services: AdminServices | None = None,',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '        if app.state.miniapp_repository is None:\n            app.state.miniapp_repository = _miniapp_repository(resolved_settings, database)\n',
              '        if app.state.miniapp_repository is None:\n            app.state.miniapp_repository = _miniapp_repository(resolved_settings, database)\n        if app.state.publication_service is None:\n            app.state.publication_service = SqlAlchemyPublicationRepository(database)\n',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '    app.state.miniapp_repository = miniapp_repository\n    app.state.admin_services = admin_services',
              '    app.state.miniapp_repository = miniapp_repository\n    app.state.publication_service = publication_service\n    app.state.admin_services = admin_services',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '    app.include_router(create_generation_router(resolved_settings))\n    if resolved_settings.miniapp_enabled:',
              '    app.include_router(create_generation_router(resolved_settings))\n    app.include_router(create_publication_router(resolved_settings))\n    app.include_router(create_publication_media_router(resolved_settings))\n    if resolved_settings.miniapp_enabled:',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '        username: str | None = Header(default=None, alias="X-FoxGen-Username"),\n    ) -> dict[str, Any]:',
              '        username: str | None = Header(default=None, alias="X-FoxGen-Username"),\n        source_publication_id: UUID | None = Header(\n            default=None, alias="X-FoxGen-Source-Publication-Id"\n        ),\n    ) -> dict[str, Any]:',
          )
          replace_once(
              'src/foxgen/api/app.py',
              '            input_data=body.input,\n            idempotency_key=idempotency_key,\n        )',
              '            input_data=body.input,\n            idempotency_key=idempotency_key,\n            source_publication_id=source_publication_id,\n        )',
          )

          # Telegram runtime: retain global /start interrupt and current wizard order.
          replace_once(
              'src/foxgen/bot/app.py',
              'from foxgen.bot.callbacks import safe_edit_callback_message\nfrom foxgen.bot.flows',
              'from foxgen.bot.callbacks import safe_edit_callback_message\nfrom foxgen.bot.feed import handle_start_payload, router as feed_router\nfrom foxgen.bot.feed_publish import router as feed_publish_router\nfrom foxgen.bot.feed_remix import router as feed_remix_router\nfrom foxgen.bot.flows',
          )
          replace_once(
              'src/foxgen/bot/app.py',
              '    input_media: TelegramInputMediaStorage,\n) -> None:\n    """Interrupt any active FSM draft and return to the canonical entrypoint."""\n\n    await clear_state_with_inputs(state, input_media)\n    await message.answer(',
              '    input_media: TelegramInputMediaStorage,\n    api_client: FoxGenApiClient | None = None,\n) -> None:\n    """Interrupt any active FSM draft, then dispatch a safe deep link or main menu."""\n\n    await clear_state_with_inputs(state, input_media)\n    text = message.text or ""\n    payload = text.partition(" ")[2].strip() if text.startswith("/start") else ""\n    if payload and api_client is not None:\n        if await handle_start_payload(message, state, api_client, payload):\n            return\n    await message.answer(',
          )
          replace_once(
              'src/foxgen/bot/app.py',
              '    dispatcher.include_router(admin_router)\n    # Quick Start already owns reference upload.',
              '    dispatcher.include_router(admin_router)\n    dispatcher.include_router(feed_router)\n    dispatcher.include_router(feed_publish_router)\n    dispatcher.include_router(feed_remix_router)\n    # Quick Start already owns reference upload.',
          )

          # Keep the real Happy Fox WebApp entrypoint and add social shortcuts.
          replace_once(
              'src/foxgen/bot/keyboards.py',
              '            [miniapp_button],\n            [InlineKeyboardButton(text="Быстрый запуск", callback_data="quick:start")],',
              '            [miniapp_button],\n            [\n                InlineKeyboardButton(text="🌐 Лента", callback_data="feed:open"),\n                InlineKeyboardButton(text="👤 Профиль", callback_data="feed:profile:me"),\n            ],\n            [\n                InlineKeyboardButton(\n                    text="📣 Опубликовать генерацию", callback_data="feed:publish:start"\n                )\n            ],\n            [InlineKeyboardButton(text="Быстрый запуск", callback_data="quick:start")],',
          )
          replace_once(
              'src/foxgen/bot/keyboards.py',
              '''def after_submit_keyboard() -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(\n        inline_keyboard=[\n            [InlineKeyboardButton(text="➕ Создать ещё", callback_data="nav:menu")],\n            [InlineKeyboardButton(text="💳 Баланс", callback_data="account:balance")],\n        ]\n    )''',
              '''def after_submit_keyboard(generation_id: str | None = None) -> InlineKeyboardMarkup:\n    rows: list[list[InlineKeyboardButton]] = []\n    if generation_id:\n        rows.append(\n            [\n                InlineKeyboardButton(\n                    text="🌐 В ленту",\n                    callback_data=f"feed:publish:feed:{generation_id}",\n                ),\n                InlineKeyboardButton(\n                    text="👤 В профиль",\n                    callback_data=f"feed:publish:profile:{generation_id}",\n                ),\n            ]\n        )\n    rows.extend(\n        [\n            [InlineKeyboardButton(text="➕ Создать ещё", callback_data="nav:menu")],\n            [\n                InlineKeyboardButton(text="🌐 Лента", callback_data="feed:open"),\n                InlineKeyboardButton(text="💳 Баланс", callback_data="account:balance"),\n            ],\n        ]\n    )\n    return InlineKeyboardMarkup(inline_keyboard=rows)''',
          )

          # Social FSM state group is separate from generation states.
          p = Path('src/foxgen/bot/states.py')
          text = p.read_text(encoding='utf-8')
          if 'class FeedStates(StatesGroup):' not in text:
              text = text.rstrip() + '''\n\n\nclass FeedStates(StatesGroup):\n    waiting_comment = State()\n    editing_profile_slug = State()\n    editing_profile_name = State()\n    editing_profile_bio = State()\n    waiting_publish_generation = State()\n    choosing_publish_scope = State()\n'''
              p.write_text(text, encoding='utf-8')

          # Router order regression includes social routers before generation FSMs.
          replace_once(
              'tests/test_admin_extension_wiring.py',
              '        "foxgen-admin",\n        "foxgen-quick-start-wizard",',
              '        "foxgen-admin",\n        "foxgen-feed",\n        "foxgen-feed-publish",\n        "foxgen-feed-remix",\n        "foxgen-quick-start-wizard",',
          )
          PY

          git add migrations src tests
          git status --short
      - name: Commit forward-port
        run: |
          git commit -m "feat(feed): forward-port publication profile remix domain"
          git push origin HEAD:agent/full-miniapp-parity
