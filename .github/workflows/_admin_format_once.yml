name: Admin format once

on:
  push:
    branches: [feat/full-admin-contour]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked formatter
        run: python -m pip install ruff==0.9.10
      - name: Format changed Python files
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.py' > /tmp/changed-python.txt
          if test -s /tmp/changed-python.txt; then
            mapfile -t files < /tmp/changed-python.txt
            ruff format "${files[@]}"
          fi
          if git diff --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'style: format admin contour'
          git push origin HEAD:feat/full-admin-contour
