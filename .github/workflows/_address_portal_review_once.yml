name: Address portal review once

on:
  push:
    branches:
      - agent/user-portal-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python scripts/address_portal_review_once.py
      - name: Install Ruff and format
        run: |
          pip install ruff==0.12.10
          ruff format src/foxgen/api/user_portal.py src/foxgen/application/user_portal.py src/foxgen/infra/user_portal.py src/foxgen/infra/admin_models.py tests/integration/test_user_portal.py tests/test_user_portal_api.py migrations/versions/20260816_0011_partner_withdrawal_idempotency.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/address_portal_review_once.py .github/workflows/_address_portal_review_once.yml
          git add -A
          git commit -m "fix(user-portal): harden auth and withdrawal idempotency"
          git push origin HEAD:agent/user-portal-parity
