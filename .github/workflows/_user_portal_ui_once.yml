name: User portal UI finalize once

on:
  push:
    branches:
      - agent/user-portal-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply user portal UI patch
        run: python scripts/patch_user_portal_ui_once.py
      - name: Commit finalized product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_user_portal_ui_once.py .github/workflows/_user_portal_ui_once.yml
          git add -A
          git commit -m "feat(miniapp): add tariffs support and partner portal UI"
          git push origin HEAD:agent/user-portal-parity
