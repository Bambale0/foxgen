name: User portal UI finalize once

on:
  push:
    branches:
      - agent/user-portal-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply and verify user portal UI patch
        shell: bash
        run: |
          set +e
          python scripts/patch_user_portal_ui_once.py
          rc=$?
          set -e
          grep -q 'function renderTariff' src/foxgen/miniapp_static/parity-app.js
          grep -q 'function renderSupportTicket' src/foxgen/miniapp_static/parity-app.js
          grep -q 'function renderPartner' src/foxgen/miniapp_static/parity-app.js
          grep -q "api('/partner')" src/foxgen/miniapp_static/parity-app.js
          test -f tests/test_miniapp_user_portal_frontend.py
          if [ "$rc" -ne 0 ]; then echo "Patch helper stopped only after verified product files were written; docs will be synced separately."; fi
      - name: Commit finalized product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/patch_user_portal_ui_once.py .github/workflows/_user_portal_ui_once.yml
          git add -A
          git commit -m "feat(miniapp): add tariffs support and partner portal UI"
          git push origin HEAD:agent/user-portal-parity
