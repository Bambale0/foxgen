name: User portal UI finalize once

on:
  push:
    branches:
      - agent/user-portal-parity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Wire Happy Fox tariff support and partner screens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/foxgen/miniapp_static/parity-app.js')
          text = app_path.read_text(encoding='utf-8')

          def replace_required(old: str, new: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_required(
              "  referenceReturn:null, generation:null, draft:null, pickerPolicy:null,\n  filters:{kind:'all',status:'all'}, toast:null,",
              "  referenceReturn:null, generation:null, draft:null, pickerPolicy:null,\n  tariff:null, supportTickets:[], supportTicket:null, partner:null, portalBusy:false,\n  filters:{kind:'all',status:'all'}, toast:null,",
          )

          replace_required(
              "async function ensureScreenData(screen){try{if(screen==='feed')await loadFeed(false);if(screen==='works')await loadWorks(false);if(screen==='profile')await loadOwnProfile();if(screen==='references')await loadReferences();if(screen==='wallet')await loadWallet();render();}catch(e){toast(e.message,'error');}}",
              "async function ensureScreenData(screen){try{if(screen==='feed')await loadFeed(false);if(screen==='works')await loadWorks(false);if(screen==='profile')await loadOwnProfile();if(screen==='references')await loadReferences();if(screen==='wallet')await loadWallet();if(screen==='tariff')await loadTariff();if(screen==='support')await loadSupport();if(screen==='partner')await loadPartner();render();}catch(e){toast(e.message,'error');}}",
          )

          replace_required(
              "async function loadReferences(){if(state.demo)return;state.references=await api('/reference-memory?limit=100');}",
              "async function loadReferences(){if(state.demo)return;state.references=await api('/reference-memory?limit=100');}\nasync function loadTariff(){if(state.demo)return;state.portalBusy=true;try{state.tariff=await api('/tariff');}finally{state.portalBusy=false;}}\nasync function loadSupport(){if(state.demo)return;state.portalBusy=true;try{const data=await api('/support');state.supportTickets=data?.items??[];}finally{state.portalBusy=false;}}\nasync function loadSupportTicket(id){if(state.demo)return;state.portalBusy=true;try{state.supportTicket=await api(`/support/${encodeURIComponent(id)}`);nav('supportTicket');}finally{state.portalBusy=false;render();}}\nasync function loadPartner(){if(state.demo)return;state.portalBusy=true;try{state.partner=await api('/partner');}finally{state.portalBusy=false;}}",
          )

          replace_required(
              "const screens={feed:renderFeed,create:renderCreate,studio:renderStudio,works:renderWorks,profile:renderProfile,wallet:renderWallet,references:renderReferencesScreen,publication:renderPublication,publicProfile:renderPublicProfile,generation:renderGeneration};",
              "const screens={feed:renderFeed,create:renderCreate,studio:renderStudio,works:renderWorks,profile:renderProfile,wallet:renderWallet,references:renderReferencesScreen,publication:renderPublication,publicProfile:renderPublicProfile,generation:renderGeneration,tariff:renderTariff,support:renderSupport,supportTicket:renderSupportTicket,partner:renderPartner};",
          )

          replace_required(
              "<button disabled>Партнёры и рефералы <small>Backend epic ещё не завершён</small></button><button disabled>Поддержка <small>Backend flow ещё не завершён</small></button>",
              "<button data-nav=\"tariff\">Тарифы <span>›</span></button><button data-nav=\"partner\">Партнёры <span>›</span></button><button data-nav=\"support\">Поддержка <span>›</span></button>",
          )

          portal_block = r'''
function portalValue(value){
  if(value===null||value===undefined||value==='')return '—';
  if(typeof value==='boolean')return value?'Да':'Нет';
  if(Array.isArray(value))return value.map(portalValue).join(' · ');
  if(typeof value==='object')return Object.entries(value).map(([k,v])=>`${human(k)}: ${portalValue(v)}`).join(' · ');
  return String(value);
}
function renderTariffPayload(payload){
  if(!payload||typeof payload!=='object')return empty('Тариф пока не опубликован','Администратор ещё не опубликовал пользовательский тариф.');
  const rows=Object.entries(payload);
  if(!rows.length)return empty('Тариф пока пуст','Опубликованная версия не содержит пользовательских параметров.');
  return `<div class="portal-kv">${rows.map(([key,value])=>`<div><span>${esc(human(key))}</span><strong>${esc(portalValue(value))}</strong></div>`).join('')}</div>`;
}
function renderTariff(){
  const item=state.tariff;
  return `<main class="hf-page">${topbar()}<section class="hf-hero compact grunge-card"><span class="stamp">TARIFF / LIVE</span><h1>Тарифы</h1><p>Только опубликованные сервером условия — без захардкоженных цен и обещаний.</p></section>${state.portalBusy?spinner():item?`<section class="portal-card"><div class="section-head"><div><h2>Версия ${esc(item.version)}</h2><small>Опубликовано ${fmtDate(item.published_at)}</small></div></div>${renderTariffPayload(item.payload)}</section>`:empty('Тариф не опубликован','Когда появится активная версия, она автоматически отобразится здесь.')}</main>`;
}
function supportStatus(value){return {open:'Открыт',pending:'Ждёт ответа',closed:'Закрыт',resolved:'Решён'}[value]??human(value);}
function renderSupport(){
  return `<main class="hf-page">${topbar()}<section class="hf-hero compact grunge-card"><span class="stamp">SUPPORT</span><h1>Поддержка</h1><p>Обращения привязаны к аккаунту и сохраняют историю ответов.</p></section><section class="portal-card"><h2>Новое обращение</h2><form id="support-create-form" class="portal-form"><label>Тема<input name="subject" maxlength="255" required placeholder="Коротко опиши вопрос"></label><label>Сообщение<textarea name="body" maxlength="4096" required placeholder="Что произошло?"></textarea></label><button class="hf-primary" ${state.portalBusy?'disabled':''}>Отправить</button></form></section><section class="section"><div class="section-head"><h2>Мои обращения</h2><button class="ghost-mini" data-refresh-support>↻</button></div>${state.portalBusy&&!state.supportTickets.length?spinner():state.supportTickets.length?`<div class="ticket-list">${state.supportTickets.map(t=>`<button data-support-ticket="${esc(t.id)}"><span><strong>${esc(t.subject)}</strong><small>${fmtDate(t.updated_at)} · ${esc(supportStatus(t.status))}</small></span><b>›</b></button>`).join('')}</div>`:empty('Обращений нет','Если возникнет проблема, создай тикет выше.')}</section></main>`;
}
function renderSupportTicket(){
  const t=state.supportTicket;
  if(!t)return `<main class="hf-page">${topbar()}${spinner()}</main>`;
  const closed=['closed','resolved'].includes(t.status);
  return `<main class="hf-page">${topbar()}<section class="portal-card ticket-head"><span class="stamp">${esc(supportStatus(t.status))}</span><h1>${esc(t.subject)}</h1><p>${fmtDate(t.created_at)} · ${esc(human(t.priority))}</p></section><section class="support-thread">${(t.messages??[]).map(m=>`<article class="support-message ${m.sender_kind==='user'?'mine':'staff'}"><strong>${m.sender_kind==='user'?'Вы':'Happy Fox'}</strong><p>${esc(m.body)}</p><small>${fmtDate(m.created_at)}</small></article>`).join('')}</section>${!closed?`<section class="portal-card"><form id="support-reply-form" class="portal-form"><label>Ответ<textarea name="body" maxlength="4096" required placeholder="Дополнить обращение…"></textarea></label><button class="hf-primary">Отправить</button></form><button class="danger-button portal-close" data-close-ticket="${esc(t.id)}">Закрыть обращение</button></section>`:'<div class="notice grunge-lite">Обращение закрыто. История остаётся доступной.</div>'}</main>`;
}
function renderPartner(){
  const data=state.partner;const p=data?.profile;const withdrawals=data?.withdrawals??[];
  if(state.portalBusy&&!data)return `<main class="hf-page">${topbar()}${spinner()}</main>`;
  return `<main class="hf-page">${topbar()}<section class="hf-hero compact grunge-card"><span class="stamp">PARTNERS</span><h1>Партнёрская программа</h1><p>Доходы и выплаты берутся из серверного партнёрского ledger-контура.</p></section>${p?.joined?`<section class="partner-stats"><div><small>Заработано</small><strong>${fmtCredits(p.earned_units)} ●</strong></div><div><small>Доступно</small><strong>${fmtCredits(p.available_units)} ●</strong></div><div><small>В ожидании</small><strong>${fmtCredits(p.pending_units)} ●</strong></div><div><small>Рефералы</small><strong>${fmtCredits(p.referrals_count)}</strong></div></section><section class="portal-card"><h2>Запросить выплату</h2><form id="partner-withdraw-form" class="portal-form"><label>Сумма<input name="amount_units" type="number" min="1" max="${Math.max(1,Number(p.available_units||1))}" required></label><label>Реквизиты<input name="destination" minlength="3" maxlength="255" required placeholder="Куда отправить выплату"></label><button class="hf-primary" ${Number(p.available_units||0)<=0?'disabled':''}>Создать заявку</button></form></section>`:`<section class="portal-card join-partner"><h2>Стать партнёром</h2><p>После подключения появится статистика приглашённых пользователей, заработка и заявок на выплату.</p><button class="hf-primary" data-partner-join>Подключиться</button></section>`}<section class="section"><h2>Выплаты</h2>${withdrawals.length?`<div class="withdraw-list">${withdrawals.map(w=>`<div><span><strong>${fmtCredits(w.amount_units)} ●</strong><small>${fmtDate(w.created_at)} · ${esc(human(w.status))}</small></span><small>${esc(w.destination||'')}</small></div>`).join('')}</div>`:empty('Заявок нет','История выплат появится здесь.')}</section></main>`;
}
'''
          if 'function renderTariff(){' not in text:
              text = text.replace('\nfunction renderFatal(error)', '\n' + portal_block + '\nfunction renderFatal(error)', 1)

          old_bind = "function bindForms(){const comment=document.getElementById('comment-form');if(comment)comment.addEventListener('submit',async e=>{e.preventDefault();const body=new FormData(comment).get('body')?.toString().trim();if(!body)return;try{const c=await api(`/publications/${state.publication.id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({surface:state.publication.scope,body})});state.comments.push(c);comment.reset();render();}catch(err){toast(err.message,'error');}});}"
          new_bind = r'''function bindForms(){
  const comment=document.getElementById('comment-form');if(comment)comment.addEventListener('submit',async e=>{e.preventDefault();const body=new FormData(comment).get('body')?.toString().trim();if(!body)return;try{const c=await api(`/publications/${state.publication.id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({surface:state.publication.scope,body})});state.comments.push(c);comment.reset();render();}catch(err){toast(err.message,'error');}});
  const create=document.getElementById('support-create-form');if(create)create.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(create);const subject=f.get('subject')?.toString().trim();const body=f.get('body')?.toString().trim();if(!subject||!body)return;try{state.portalBusy=true;render();const item=await api('/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject,body})});state.supportTicket=item;await loadSupport();nav('supportTicket');toast('Обращение создано');}catch(err){toast(err.message,'error');}finally{state.portalBusy=false;render();}});
  const reply=document.getElementById('support-reply-form');if(reply)reply.addEventListener('submit',async e=>{e.preventDefault();const body=new FormData(reply).get('body')?.toString().trim();if(!body||!state.supportTicket)return;try{state.supportTicket=await api(`/support/${state.supportTicket.id}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});render();toast('Ответ отправлен');}catch(err){toast(err.message,'error');}});
  const withdrawal=document.getElementById('partner-withdraw-form');if(withdrawal)withdrawal.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(withdrawal);const amount_units=Number(f.get('amount_units'));const destination=f.get('destination')?.toString().trim();if(!Number.isInteger(amount_units)||amount_units<=0||!destination)return;try{await api('/partner/withdrawals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount_units,destination})});await loadPartner();render();toast('Заявка на выплату создана');}catch(err){toast(err.message,'error');}});
}'''
          replace_required(old_bind, new_bind)

          click_anchor = "    if(el.dataset.nav){nav(el.dataset.nav);return;}"
          click_new = click_anchor + "\n    if(el.dataset.supportTicket){await loadSupportTicket(el.dataset.supportTicket);return;}\n    if(el.hasAttribute('data-refresh-support')){await loadSupport();render();return;}\n    if(el.dataset.closeTicket){if(await confirmAction('Закрыть это обращение?')){state.supportTicket=await api(`/support/${el.dataset.closeTicket}/close`,{method:'POST'});await loadSupport();render();toast('Обращение закрыто');}return;}\n    if(el.hasAttribute('data-partner-join')){state.partner={profile:await api('/partner/join',{method:'POST'}),withdrawals:[]};await loadPartner();render();toast('Партнёрская программа подключена');return;}"
          replace_required(click_anchor, click_new)

          app_path.write_text(text, encoding='utf-8')

          css_path = Path('src/foxgen/miniapp_static/parity.css')
          css = css_path.read_text(encoding='utf-8')
          portal_css = r'''

/* User portal: tariffs / support / partners. Keep forms clean; grunge stays decorative. */
.portal-card{background:var(--panel,#111);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:18px;margin:14px 0}.portal-card h1,.portal-card h2{margin:0 0 12px}.portal-kv,.price-list{display:grid;gap:8px}.portal-kv>div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.portal-kv span{color:#999}.portal-kv strong{text-align:right;max-width:65%;overflow-wrap:anywhere}.portal-form{display:grid;gap:12px}.portal-form label{display:grid;gap:7px;color:#aaa;font-size:13px}.portal-form input,.portal-form textarea{width:100%;box-sizing:border-box;background:#090909;color:#f5f5f5;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 14px;font:inherit;outline:none}.portal-form textarea{min-height:110px;resize:vertical}.portal-form input:focus,.portal-form textarea:focus{border-color:rgba(255,119,32,.72);box-shadow:0 0 0 3px rgba(255,119,32,.08)}.ticket-list{display:grid;gap:9px}.ticket-list>button{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;background:#101010;color:#fff;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px}.ticket-list span{display:grid;gap:5px}.ticket-list small{color:#888}.support-thread{display:grid;gap:10px;margin:14px 0}.support-message{max-width:88%;border-radius:17px;padding:12px 14px;background:#151515;border:1px solid rgba(255,255,255,.07)}.support-message.mine{justify-self:end;background:rgba(255,111,23,.12);border-color:rgba(255,111,23,.28)}.support-message p{white-space:pre-wrap;margin:6px 0}.support-message small{color:#777}.portal-close{width:100%;margin-top:10px}.partner-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.partner-stats>div{background:#111;border:1px solid rgba(255,255,255,.07);border-radius:17px;padding:14px;display:grid;gap:4px}.partner-stats small{color:#888}.partner-stats strong{font-size:20px}.withdraw-list{display:grid;gap:8px}.withdraw-list>div{display:flex;justify-content:space-between;gap:12px;padding:13px;background:#101010;border-radius:14px;border:1px solid rgba(255,255,255,.06)}.withdraw-list span{display:grid;gap:4px}.withdraw-list small{color:#888}.join-partner p{color:#aaa;line-height:1.5}.settings-list button:not(:disabled){cursor:pointer}
'''
          if '/* User portal: tariffs / support / partners.' not in css:
              css += portal_css
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/test_miniapp_user_portal_frontend.py')
          test_path.write_text('''from pathlib import Path\n\n\ndef _frontend() -> str:\n    return Path("src/foxgen/miniapp_static/parity-app.js").read_text(encoding="utf-8")\n\n\ndef test_user_portal_screens_are_real_miniapp_routes() -> None:\n    text = _frontend()\n    for marker in (\n        "renderTariff",\n        "renderSupport",\n        "renderSupportTicket",\n        "renderPartner",\n        "api('/tariff')",\n        "api('/support')",\n        "api('/partner')",\n        "data-nav=\\\"tariff\\\"",\n        "data-nav=\\\"partner\\\"",\n        "data-nav=\\\"support\\\"",\n    ):\n        assert marker in text\n\n\ndef test_user_portal_does_not_expose_admin_transport() -> None:\n    text = _frontend()\n    assert "/internal/admin" not in text\n    assert "admin_hmac" not in text.lower()\n''', encoding='utf-8')

          docs = Path('docs/miniapp.md')
          doc = docs.read_text(encoding='utf-8')
          marker = '## User portal parity\n'
          section = '''\n## User portal parity\n\nHappy Fox also exposes owner-scoped user portal surfaces through the Telegram-derived Mini App JWT:\n\n- **Tariffs** — the current published tariff version; the browser does not invent or cache commercial terms.\n- **Support** — create/list/read/reply/close the current user’s support tickets with durable message history.\n- **Partners** — join the partner program, read earned/pending/available units and referral count, inspect withdrawal history and create an owner-scoped withdrawal request.\n\nThese routes reuse the existing durable admin-domain tables but never expose admin HMAC credentials or operator actions to browser JavaScript.\n\n'''
          if marker not in doc:
              anchor = '## Paid generation boundary\n'
              if anchor not in doc:
                  raise SystemExit('docs miniapp anchor missing')
              doc = doc.replace(anchor, section + anchor, 1)
              docs.write_text(doc, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/_user_portal_ui_once.yml
          git add src/foxgen/miniapp_static/parity-app.js src/foxgen/miniapp_static/parity.css tests/test_miniapp_user_portal_frontend.py docs/miniapp.md .github/workflows/_user_portal_ui_once.yml
          git commit -m "feat(miniapp): add tariffs support and partner portal UI"
          git push origin HEAD:agent/user-portal-parity
