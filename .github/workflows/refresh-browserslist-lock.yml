name: Refresh browserslist lockfile

on:
  push:
    branches:
      - fix/unify-suno-main-menu

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Refresh patched transitive dependency
        working-directory: frontend/miniapp-v0
        run: |
          npm update browserslist --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/browserslist']?.version || '';
          const parts = version.split('.').map(Number);
          const safe = parts.length === 3 && parts[0] === 4 && (parts[1] > 28 || (parts[1] === 28 && parts[2] >= 7));
          console.log(`browserslist=${version}`);
          if (!safe) process.exit(1);
          NODE
      - name: Verify production audit
        working-directory: frontend/miniapp-v0
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated lockfile
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/miniapp-v0/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): patch browserslist audit"
          git push origin HEAD:fix/unify-suno-main-menu
