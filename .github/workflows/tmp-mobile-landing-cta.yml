name: Apply mobile landing CTA

on:
  push:
    branches:
      - feat/mobile-landing-try-cta-20260909

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mobile-landing-try-cta-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Patch mobile CTA and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('frontend/miniapp-v0/app/landing/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''        <div className="order-3 flex w-full items-center gap-2 sm:order-none sm:w-auto">
          <ReferralAwareLink
            kind="bot"
            className="inline-flex min-h-10 flex-1 items-center justify-center rounded-xl border border-[#229ED9]/45 bg-card/70 px-3 text-xs font-semibold text-foreground transition-colors hover:border-[#229ED9]/70 hover:bg-[#229ED9]/10 sm:flex-none sm:px-4 sm:text-sm"
          >
            <TelegramBrandIcon className="mr-2 size-4 text-[#229ED9]" />
            Попробовать ТГ
          </ReferralAwareLink>
          <ReferralAwareLink
            kind="web"
            className="inline-flex min-h-10 flex-1 items-center justify-center rounded-xl border border-primary/35 bg-primary px-3 text-xs font-semibold text-primary-foreground shadow-[0_10px_30px_rgba(255,106,0,0.18)] transition-transform hover:-translate-y-0.5 sm:flex-none sm:px-4 sm:text-sm"
          >
            <Sparkles className="mr-2 size-4" aria-hidden="true" />
            Попробовать на сайте
          </ReferralAwareLink>
        </div>'''
          new = '''        <div className="order-3 w-full sm:order-none sm:w-auto">
          <ReferralAwareLink
            kind="web"
            className="flex min-h-[72px] w-full items-center justify-center rounded-[22px] border border-primary/40 bg-primary px-6 text-xl font-bold text-primary-foreground shadow-[0_18px_50px_rgba(255,106,0,0.35)] transition-transform active:scale-[0.99] sm:hidden"
          >
            <Sparkles className="mr-3 size-6" aria-hidden="true" />
            Попробовать
            <ArrowRight className="ml-3 size-5" aria-hidden="true" />
          </ReferralAwareLink>

          <div className="hidden items-center gap-2 sm:flex">
            <ReferralAwareLink
              kind="bot"
              className="inline-flex min-h-10 items-center justify-center rounded-xl border border-[#229ED9]/45 bg-card/70 px-4 text-sm font-semibold text-foreground transition-colors hover:border-[#229ED9]/70 hover:bg-[#229ED9]/10"
            >
              <TelegramBrandIcon className="mr-2 size-4 text-[#229ED9]" />
              Попробовать ТГ
            </ReferralAwareLink>
            <ReferralAwareLink
              kind="web"
              className="inline-flex min-h-10 items-center justify-center rounded-xl border border-primary/35 bg-primary px-4 text-sm font-semibold text-primary-foreground shadow-[0_10px_30px_rgba(255,106,0,0.18)] transition-transform hover:-translate-y-0.5"
            >
              <Sparkles className="mr-2 size-4" aria-hidden="true" />
              Попробовать на сайте
            </ReferralAwareLink>
          </div>
        </div>'''
          if old not in text:
              raise SystemExit('landing header CTA block did not match expected source')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('frontend/miniapp-v0/__tests__/landing.test.tsx')
          test_text = test.read_text(encoding='utf-8')
          anchor = '''    expect(screen.getByRole('link', { name: 'Попробовать на сайте' })).toHaveAttribute(
      'href',
      'https://app.happy-fox.online/mini-app/?startapp=ref_AZLRXW6L',
    )
'''
          addition = anchor + '''    const mobileTryLink = screen.getByRole('link', { name: 'Попробовать' })
    expect(mobileTryLink).toHaveAttribute(
      'href',
      'https://app.happy-fox.online/mini-app/?startapp=ref_AZLRXW6L',
    )
    expect(mobileTryLink).toHaveClass('sm:hidden', 'min-h-[72px]', 'w-full', 'text-xl')
'''
          if anchor not in test_text:
              raise SystemExit('landing CTA test anchor did not match expected source')
          test.write_text(test_text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Install frontend dependencies
        working-directory: frontend/miniapp-v0
        run: npm ci
      - name: Run landing regression test
        working-directory: frontend/miniapp-v0
        run: npm test -- --runInBand __tests__/landing.test.tsx
      - name: Commit tested patch and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-mobile-landing-cta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/miniapp-v0/app/landing/page.tsx frontend/miniapp-v0/__tests__/landing.test.tsx
          git commit -m 'feat(landing): add prominent mobile try CTA'
          git push origin HEAD:feat/mobile-landing-try-cta-20260909
