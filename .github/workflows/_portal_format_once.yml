name: Portal Ruff format once

on:
  push:
    branches:
      - agent/user-portal-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff==0.12.10
      - name: Format changed Python tests
        run: ruff format tests/integration/test_user_portal.py tests/test_miniapp_user_portal_frontend.py tests/test_user_portal_api.py src/foxgen/api/user_portal.py src/foxgen/application/user_portal.py src/foxgen/infra/user_portal.py src/foxgen/api/app.py src/foxgen/api/miniapp.py
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_portal_format_once.yml
          git add -A
          git commit -m "style: apply Ruff formatting to user portal"
          git push origin HEAD:agent/user-portal-parity
