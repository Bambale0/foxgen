name: Patch and validate Happy Fox frontend once

on:
  push:
    branches: [agent/miniapp-full-backend-frontend]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/miniapp-full-backend-frontend
          fetch-depth: 0
      - name: Patch render scope and validate static assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c "from pathlib import Path; p=Path('src/foxgen/miniapp_static/app.js'); s=p.read_text(encoding='utf-8'); old='promptPlaceholder(item))}\"'; new='promptPlaceholder(modelBySlug(draft.modelSlug) ?? {}))}\"'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new),encoding='utf-8')"
          node --check src/foxgen/miniapp_static/app.js
          grep -q '/mini-app/studio.css' src/foxgen/miniapp_static/index.html
          grep -q -- '--grunge-opacity: .18' src/foxgen/miniapp_static/studio.css
          git rm .github/workflows/_miniapp_frontend_patch_once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/foxgen/miniapp_static/app.js
          git commit -m 'fix(miniapp): validate schema-driven studio renderer'
          git push origin HEAD:agent/miniapp-full-backend-frontend
