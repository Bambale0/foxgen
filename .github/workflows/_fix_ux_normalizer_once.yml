name: Apply final UX normalizer fix once

on:
  push:
    branches:
      - feat/rewrite-happyfox-screen-copy-20260910

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rewrite-happyfox-screen-copy-20260910
          fetch-depth: 0
      - name: Apply final UX normalizer fix
        run: python3 scripts/_fix_ux_normalizer_once.py
      - name: Verify idempotent product normalization
        env:
          PRODUCT_ID: happyfox
          NEXT_PUBLIC_PRODUCT_ID: happyfox
        run: |
          python3 scripts/apply_happyfox_main_menu.py
          python3 scripts/apply_happyfox_main_menu.py
          grep -q 'Другие AI-инструменты' bot/handlers/common.py
          grep -q '@media (pointer: coarse)' frontend/miniapp-v0/app/globals.css
      - name: Commit final UX fix
        run: |
          rm -f scripts/_fix_ux_normalizer_once.py .github/workflows/_fix_ux_normalizer_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ux): align other-AI screen and product normalizer"
          git push origin HEAD:feat/rewrite-happyfox-screen-copy-20260910
