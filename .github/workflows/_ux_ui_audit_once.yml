name: Apply UX UI audit fixes once

on:
  push:
    branches:
      - feat/rewrite-happyfox-screen-copy-20260910

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rewrite-happyfox-screen-copy-20260910
          fetch-depth: 0
      - name: Apply audited UX UI fixes
        run: python3 scripts/_apply_ux_ui_audit_once.py
      - name: Validate Python sources and UX anchors
        run: |
          python3 -m compileall -q bot/handlers/common.py scripts/apply_happyfox_product_copy.py
          grep -q 'prefers-reduced-motion' frontend/miniapp-v0/app/globals.css
          grep -q 'aria-current' frontend/miniapp-v0/components/tab-nav.tsx
          ! grep -R -n -E 'text-\[(9|10)px\]|🍌' frontend/miniapp-v0/components --include='*.tsx'
      - name: Commit audited UI
        run: |
          rm -f scripts/_apply_ux_ui_audit_once.py .github/workflows/_ux_ui_audit_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ux): audit HappyFox mobile UI and accessibility"
          git push origin HEAD:feat/rewrite-happyfox-screen-copy-20260910
