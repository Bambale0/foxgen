name: Run HappyFox copy rewrite

on:
  push:
    branches:
      - feat/rewrite-happyfox-screen-copy-20260910

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rewrite-happyfox-screen-copy-20260910
          fetch-depth: 0
      - name: Extract and apply deterministic rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/_rewrite_screen_copy_once.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          strict = "    if old not in text:\n        raise SystemExit(f'missing expected copy in {path}: {old!r}')"
          tolerant = "    if old not in text:\n        if path == 'bot/handlers/common.py' and old.startswith('\\\"Если не получается генерация'):\n            return\n        raise SystemExit(f'missing expected copy in {path}: {old!r}')"
          if strict not in script:
              raise SystemExit('rewrite helper shape changed')
          script = script.replace(strict, tolerant, 1)
          Path('/tmp/rewrite_screen_copy.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/rewrite_screen_copy.py
      - name: Validate rewritten sources
        run: |
          python3 -m compileall -q bot/product.py bot/handlers/common.py bot/handlers/image_analyzer.py bot/max_product_channel.py
          python3 -m pytest -q tests/test_happyfox_public_screen_copy.py
      - name: Commit rewritten copy
        run: |
          rm -f .github/workflows/_rewrite_screen_copy_once.yml .github/workflows/_run_copy_rewrite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(copy): rewrite HappyFox screen descriptions"
          git push origin HEAD:feat/rewrite-happyfox-screen-copy-20260910
