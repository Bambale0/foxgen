name: Rewrite HappyFox screen copy once

on:
  push:
    branches:
      - feat/rewrite-happyfox-screen-copy-20260910

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rewrite-happyfox-screen-copy-20260910
          fetch-depth: 0
