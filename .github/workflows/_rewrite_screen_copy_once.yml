          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected copy in {path}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # Mini App — service and home screens.
          replace('frontend/miniapp-v0/components/service-grid.tsx',
                  'Загрузите референс — AI соберёт точный prompt для похожей генерации.',
