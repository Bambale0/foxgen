name: Temporary full HappyFox copy refresh

on:
  push:
    branches:
      - fix/full-screen-copy-refresh-20260910

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/full-screen-copy-refresh-20260910
          fetch-depth: 0
      - name: Apply full copy refresh
        run: python3 .github/tmp_full_copy_refresh.py
      - name: Validate generated changes
        run: |
          python3 -m compileall -q scripts/ensure_happyfox_miniapp_cache_headers.py
          git diff --check
      - name: Commit clean branch
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/tmp-full-copy-refresh.yml .github/tmp_full_copy_refresh.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: refresh all HappyFox screen descriptions"
          git push origin HEAD:fix/full-screen-copy-refresh-20260910
