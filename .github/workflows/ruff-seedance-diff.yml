name: Ruff Seedance diff

on:
  push:
    branches:
      - feat/seedance-25-official-flow

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: |
          python -m ruff check \
            bot/handlers/seedance_25_new_priority.py \
            bot/handlers/seedance_25_official_contract.py \
            bot/services/seedance_25_service.py \
            tests/test_seedance25_official_contract.py \
            --fix --diff || true
