name: Ruff Seedance diff

on:
  push:
    branches:
      - feat/seedance-25-official-flow

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/seedance-25-official-flow
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - name: Reject stale Auto duration and apply Ruff
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/handlers/seedance_25_official_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '        "duration": _normalized_duration(data.get("v_duration", 5)),\n'
          new = '        "duration": int(data.get("v_duration", 5) or 5),\n'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m ruff check \
            bot/handlers/seedance_25_new_priority.py \
            bot/handlers/seedance_25_official_contract.py \
            bot/services/seedance_25_service.py \
            tests/test_seedance25_official_contract.py \
            --fix
          git diff --check
      - name: Commit compatibility delta
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/handlers/seedance_25_official_contract.py
          git commit -m "fix(seedance): reject legacy auto duration"
          git push origin HEAD:feat/seedance-25-official-flow
