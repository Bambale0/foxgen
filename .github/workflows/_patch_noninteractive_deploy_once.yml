name: Patch streamed deploy stdin once

on:
  push:
    branches: [agent/noninteractive-deploy-run]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/noninteractive-deploy-run
          fetch-depth: 0
      - name: Disable stdin for remote one-shot compose runs
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/deploy-production.sh')
          text = path.read_text(encoding='utf-8')
          old = '''log "ensuring the private media bucket exists"\ncompose run --rm minio-init\n\nlog "applying database migrations"\ncompose run --rm migrate'''
          new = '''log "ensuring the private media bucket exists"\ncompose run -T --rm minio-init\n\nlog "applying database migrations"\ncompose run -T --rm migrate'''
          if text.count(old) != 1:
              raise SystemExit('expected deploy compose-run block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_production_deploy_contract.py')
          text = test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_streamed_deploy_disables_stdin_for_one_shot_compose_runs() -> None:\n    script = _deploy_script()\n\n    assert "compose run -T --rm minio-init" in script\n    assert "compose run -T --rm migrate" in script\n    assert "compose run --rm minio-init" not in script\n    assert "compose run --rm migrate" not in script\n'''
          marker = 'def test_deploy_never_reconciles_untracked_production_files() -> None:'
          if 'test_streamed_deploy_disables_stdin_for_one_shot_compose_runs' not in text:
              idx = text.index(marker)
              text = text[:idx] + addition + '\n' + text[idx:]
              test.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/_patch_noninteractive_deploy_once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add scripts/deploy-production.sh tests/test_production_deploy_contract.py
          git commit -m 'fix(deploy): keep streamed script stdin isolated'
          git push origin HEAD:agent/noninteractive-deploy-run
