name: Full parity format social once

on:
  push:
    branches:
      - agent/full-miniapp-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.9.10'
      - name: Format only parity-changed Python files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.py')
          printf '%s\n' "${files[@]}"
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations src tests
          git commit -m 'style(feed): normalize forward-ported social code' || exit 0
          git push origin HEAD:agent/full-miniapp-parity
