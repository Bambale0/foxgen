name: Mini App browser E2E

on:
  pull_request:
    paths:
      - "frontend/miniapp/**"
      - "src/foxgen/**"
      - "migrations/**"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/miniapp-browser-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/miniapp/**"
      - "src/foxgen/**"
      - "migrations/**"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/miniapp-browser-e2e.yml"

permissions:
  contents: read

concurrency:
  group: miniapp-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FOXGEN_ENV: test
  FOXGEN_DATABASE_URL: postgresql+asyncpg://foxgen:foxgen@127.0.0.1:5432/foxgen_browser_e2e
  FOXGEN_REDIS_URL: redis://127.0.0.1:6379/14
  FOXGEN_API_HOST: 127.0.0.1
  FOXGEN_API_PORT: "8080"
  FOXGEN_MINIAPP_ENABLED: "true"
  FOXGEN_TELEGRAM_BOT_TOKEN: "123456789:AAFoxGenBrowserE2ETestToken"
  E2E_TELEGRAM_BOT_TOKEN: "123456789:AAFoxGenBrowserE2ETestToken"
  FOXGEN_MINIAPP_JWT_SECRET: "browser-e2e-miniapp-jwt-secret-long-enough-for-hs256"
  FOXGEN_INTERNAL_API_TOKEN: "browser-e2e-internal-api-token-long-enough"
  FOXGEN_TASK_SUBMISSION_ENABLED: "true"
  FOXGEN_KIE_API_KEY: "browser-e2e-kie-key"
  FOXGEN_KIE_CALLBACK_BASE_URL: "https://foxgen.example.test"
  MINIAPP_E2E_BASE_URL: "http://127.0.0.1:8080/mini-app/"

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foxgen_browser_e2e
          POSTGRES_USER: foxgen
          POSTGRES_PASSWORD: foxgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foxgen -d foxgen_browser_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/miniapp/package.json

      - name: Install backend dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --editable .
          python -m pip check

      - name: Install frontend and Playwright
        working-directory: frontend/miniapp
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Build production Mini App export
        working-directory: frontend/miniapp
        run: |
          npm run typecheck
          npm run build
          test -s out/index.html
          test -d out/_next/static

      - name: Install production export into FastAPI static mount
        run: |
          rm -rf src/foxgen/miniapp_static
          mkdir -p src/foxgen/miniapp_static
          cp -a frontend/miniapp/out/. src/foxgen/miniapp_static/
          test -s src/foxgen/miniapp_static/index.html

      - name: Migrate real PostgreSQL
        run: |
          alembic upgrade head
          alembic current --check-heads

      - name: Start real FastAPI and wait for Mini App
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c "from foxgen.cli import run_api; run_api()" > /tmp/foxgen-browser-e2e-api.log 2>&1 &
          echo $! > /tmp/foxgen-browser-e2e-api.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/tmp/ready.json \
              && curl --fail --silent http://127.0.0.1:8080/mini-app/ >/tmp/miniapp.html; then
              cat /tmp/ready.json
              grep -Fq '/mini-app/_next/' /tmp/miniapp.html
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/foxgen-browser-e2e-api.pid)" 2>/dev/null; then
              cat /tmp/foxgen-browser-e2e-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/foxgen-browser-e2e-api.log
          exit 1

      - name: Run production browser journeys
        working-directory: frontend/miniapp
        run: npm run e2e

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: miniapp-browser-e2e-diagnostics
          path: |
            frontend/miniapp/playwright-report
            frontend/miniapp/test-results
            /tmp/foxgen-browser-e2e-api.log
            /tmp/ready.json
            /tmp/miniapp.html
          if-no-files-found: warn

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if test -f /tmp/foxgen-browser-e2e-api.pid; then
            kill "$(cat /tmp/foxgen-browser-e2e-api.pid)" 2>/dev/null || true
          fi
