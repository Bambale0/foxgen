name: Publish HappyFox deploy run

on:
  workflow_run:
    workflows:
      - Deploy HappyFox production
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Link production deploy run to commit
    runs-on: ubuntu-24.04
    steps:
      - name: Publish run URL
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_URL: ${{ github.event.workflow_run.html_url }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          description="HappyFox production deploy failed; open run logs"
          if [ "$DEPLOY_CONCLUSION" = success ]; then
            state=success
            description="HappyFox production deploy succeeded"
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${DEPLOY_SHA}" \
            -f state="$state" \
            -f context='foxgen/production-deploy-run' \
            -f description="$description" \
            -f target_url="$DEPLOY_URL"
