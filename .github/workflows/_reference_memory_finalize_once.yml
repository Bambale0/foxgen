      - name: Install Ruff and format changed Python
        shell: bash
        run: |
          python -m pip install 'ruff>=0.9,<1'
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then
            ruff format "${files[@]}"
            ruff check "${files[@]}"
          fi
      - name: Commit finalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(reference-memory): finalize durable reference contracts'
