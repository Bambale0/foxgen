name: Reference memory finalize once

on:
  push:
    branches:
      - agent/reference-memory

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Wait for earlier one-shot helpers and refresh branch
        shell: bash
        run: |
          sleep 60
          git pull --rebase origin agent/reference-memory
      - name: Finalize reference-memory contracts and canonical docs
        shell: bash
        run: |
          python - <<'PY'
