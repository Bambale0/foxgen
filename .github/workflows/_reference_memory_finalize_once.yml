Durable saved-image memory is controlled by `FOXGEN_REFERENCE_MEMORY_MAX_ITEMS` (default 50), `FOXGEN_REFERENCE_MEMORY_MAX_TOTAL_BYTES` (default 500 MiB) and `FOXGEN_REFERENCE_MEMORY_PRESIGNED_URL_TTL_SECONDS` (default 21600). Saved bytes use the normal private S3/MinIO configuration under `references/`; the short `inputs/` lifecycle must never target that prefix. External preview/provider reads use the existing public FoxGen API origin (`FOXGEN_TELEGRAM_INPUT_PUBLIC_BASE_URL`) through a short-lived HMAC-signed `/v1/reference-media/*` capability while MinIO stays private.
