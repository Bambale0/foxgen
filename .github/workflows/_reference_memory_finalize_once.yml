## Reference memory

`reference_assets` stores durable, owner-scoped saved-image metadata. Rows reference `users.id`, use server-generated private `references/<user>/<uuid>.*` storage keys and move through `uploading -> active -> delete_pending -> deleted` (or `failed`). Owner/checksum and owner/status/creation indexes support quota, de-duplication and library browsing. `delete_pending` is paired with a deduplicated `reference.delete` event in the shared outbox; the worker removes private S3 bytes before the final `deleted` transition.
''',
