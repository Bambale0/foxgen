              "docs/api-reference.md": r'''

## Reference memory API

Trusted backend callers use the internal bearer plus `X-FoxGen-User-Id` for `GET/POST /v1/reference-memory`, `POST /v1/reference-memory/resolve` and `DELETE /v1/reference-memory/{uuid}`. Save accepts only `inputs/<authenticated-user-id>/...` temporary keys. Resolve is the final owner/active-state gate before provider admission.

`GET /v1/reference-media/{uuid}?expires=...&signature=...` is a separate public read-only capability for Telegram/provider image fetches. It verifies HMAC+expiry, requires the durable row to remain `active`, and streams the object from private S3/MinIO without exposing storage credentials or internal endpoints.
''',
              "docs/architecture.md": r'''

## Durable reference memory

Saved image references are PostgreSQL/S3 business state, not Redis FSM state. PostgreSQL owns user association, checksum/quota and lifecycle; private S3 owns `references/` bytes; Redis holds only browser cursor/selection and UUID locators in an active draft. Promotion from temporary `inputs/` is explicit. Public consumers read through revocable short-lived FoxGen `/v1/reference-media/*` capabilities, so private MinIO never needs public ingress. Deletion first removes the row from `active`, then a durable outbox event drives idempotent S3 cleanup.
''',
              "docs/security.md": r'''

## Saved-reference security

Reference-memory create/list/resolve/delete are authenticated internal user-context operations. Save rejects temporary keys outside `inputs/<authenticated-user-id>/`. Durable UUIDs are owner-scoped and only `active` rows resolve. Telegram/KIE receive no S3 credential or internal MinIO URL; they receive a short-lived HMAC capability to the public FoxGen reference-media proxy. The proxy verifies signature/expiry and rechecks `active` state before every stream, so deletion revokes previously issued capabilities immediately. `/start`, `/menu` and draft cleanup ignore durable `reference_id` locators and delete only temporary inputs.
