name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - migrate/tanyapi-core-20260820

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOT_TOKEN: 123456:TEST_TOKEN_FOR_CI_ONLY
  PYTHONPATH: ${{ github.workspace }}
  PRODUCT_ID: happyfox
  NEXT_PUBLIC_PRODUCT_ID: happyfox

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pytest pytest-asyncio pytest-mock ruff
          pip install --quiet -r requirements.txt
          python -m pip check
      - name: Normalize product copy
        run: |
          python scripts/apply_visible_copy_fixes.py
          python scripts/apply_happyfox_product_copy.py
      - name: Compile runtime
        run: python -m compileall -q bot scripts
      - name: Ruff HappyFox Python delta
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base_sha="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          head_sha="${PR_HEAD_SHA:-$CURRENT_SHA}"
          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            base_sha="${head_sha}^"
          fi

          # The one-time repository cutover replaces the old experimental FoxGen
          # tree with the already-verified tanyapi production snapshot. Historical
          # upstream lint debt is not reclassified as new HappyFox code. Detect
          # that boundary by the migration provenance file appearing for the first
          # time and lint only the post-import HappyFox delta. Full pytest/browser/
          # Docker gates still validate the complete resulting tree below.
          if ! git cat-file -e "${base_sha}:MIGRATION_SOURCE.md" 2>/dev/null \
            && git cat-file -e "${head_sha}:MIGRATION_SOURCE.md" 2>/dev/null; then
            echo "Detected one-time tanyapi migration boundary"
            base_sha="${head_sha}^"
          fi

          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMRT "$base_sha" "$head_sha" -- \
              'bot/*.py' 'bot/**/*.py' 'scripts/*.py' 'scripts/**/*.py' \
              'tests/*.py' 'tests/**/*.py'
          )

          if [ "${#changed_python[@]}" -eq 0 ]; then
            echo 'No changed Python files to lint'
            exit 0
          fi

          printf 'Linting HappyFox Python delta:\n%s\n' "${changed_python[*]}"
          python -m ruff check "${changed_python[@]}" --output-format=github
      - name: Safe regression suite
        run: |
          pytest tests/ \
            --ignore=tests/live \
            -m "not live_smoke" \
            -q \
            --tb=short

  miniapp:
    name: Mini App build and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/miniapp-v0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/miniapp-v0/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Build production static export
        run: npm run build
      - name: Verify HappyFox static export
        run: |
          test -s out/index.html
          test -d out/_next/static
          grep -q '_next/static' out/index.html
          grep -q 'HappyFox' out/index.html
          test -s out/happyfox-logo.webp
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare browser E2E export
        run: |
          rm -rf .e2e-server
          mkdir -p .e2e-server/mini-app
          cp -R out/. .e2e-server/mini-app/
      - name: Critical browser journeys
        run: node e2e/critical-flows.mjs

  docker:
    name: Production Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - backend
      - miniapp
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build exact source image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: foxgen-happyfox-ci:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=ci
      - name: Verify image runtime
        run: |
          docker run --rm --entrypoint python foxgen-happyfox-ci:${GITHUB_SHA} \
            -m compileall -q /app/bot /app/scripts
          docker run --rm \
            -e BOT_TOKEN='123456:TEST_TOKEN_FOR_CI_ONLY' \
            -e PRODUCT_ID=happyfox \
            -e BANANO_SKIP_PROJECT_ENV=1 \
            -e BANANO_LOG_TO_STDOUT=1 \
            --entrypoint python foxgen-happyfox-ci:${GITHUB_SHA} \
            -c 'import bot.config, bot.database, bot.main, bot.miniapp, bot.product; assert bot.product.product.product_id == "happyfox"; print("HappyFox container imports: ok")'
          docker run --rm --entrypoint sh foxgen-happyfox-ci:${GITHUB_SHA} \
            -c '! grep -q "🏠 <b>NEUROMIX</b>" /app/bot/handlers/common.py'
          docker run --rm --entrypoint ffmpeg foxgen-happyfox-ci:${GITHUB_SHA} -version >/dev/null
          docker run --rm --entrypoint pg_dump foxgen-happyfox-ci:${GITHUB_SHA} --version >/dev/null
          docker run --rm --entrypoint sqlite3 foxgen-happyfox-ci:${GITHUB_SHA} --version >/dev/null
