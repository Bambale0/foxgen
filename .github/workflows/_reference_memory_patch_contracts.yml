name: Reference memory patch contracts

on:
  push:
    branches:
      - agent/reference-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Update runtime router-order contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = '        "foxgen-quick-start-wizard",\n        "foxgen-generation-wizard",'
          replacement = (
              '        "foxgen-quick-start-wizard",\n'
              '        "foxgen-reference-memory",\n'
              '        "foxgen-generation-wizard",'
          )
          changed = []
          for path in Path("tests").rglob("test_*.py"):
              text = path.read_text(encoding="utf-8")
              if needle not in text or '"foxgen-reference-memory"' in text:
                  continue
              path.write_text(text.replace(needle, replacement), encoding="utf-8")
              changed.append(str(path))
          print("patched", changed)
          PY
      - name: Commit contract updates
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git pull --rebase origin agent/reference-memory
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          git commit -m 'test(reference-memory): update runtime router order contract'
          git push origin HEAD:agent/reference-memory
