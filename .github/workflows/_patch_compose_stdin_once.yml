name: Patch compose stdin once

on:
  push:
    branches: [agent/close-compose-run-stdin]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/close-compose-run-stdin
          fetch-depth: 0
      - name: Close stdin for one-shot compose runs
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy = Path('scripts/deploy-production.sh')
          text = deploy.read_text(encoding='utf-8')
          replacements = {
              'compose run -T --rm minio-init\n': 'compose run -T --rm minio-init </dev/null\n',
              'compose run -T --rm migrate\n': 'compose run -T --rm migrate </dev/null\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old.strip()}')
              text = text.replace(old, new)
          deploy.write_text(text, encoding='utf-8')

          test = Path('tests/test_production_deploy_contract.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'assert "compose run -T --rm minio-init" in script\n'
              '    assert "compose run -T --rm migrate" in script\n',
              'assert "compose run -T --rm minio-init </dev/null" in script\n'
              '    assert "compose run -T --rm migrate </dev/null" in script\n',
          )
          if '</dev/null' not in text:
              raise SystemExit('stdin-redirection regression assertions were not installed')
          test.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/_patch_compose_stdin_once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/deploy-production.sh tests/test_production_deploy_contract.py
          git commit -m 'fix(deploy): close stdin for one-shot compose runs'
          git push origin HEAD:agent/close-compose-run-stdin
