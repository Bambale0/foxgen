name: Deploy HappyFox production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main SHA to deploy; leave empty for current main
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: happyfox-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified HappyFox main SHA
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production

    env:
      DEPLOY_HOST: ${{ vars.HAPPYFOX_DEPLOY_HOST || '5.35.124.201' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      HAPPYFOX_RUNTIME_ENV: ${{ secrets.HAPPYFOX_RUNTIME_ENV }}
      DEPLOY_USER: ${{ vars.HAPPYFOX_DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.HAPPYFOX_DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.HAPPYFOX_DEPLOY_PATH || '/opt/happyfox/repo' }}
      EXPECTED_HOST_FINGERPRINT: SHA256:NjLkwjwPwDroguKC0FMTFEjaSJD+vFEfL3EsjEN0pI4
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

    steps:
      - name: Resolve manual main SHA
        if: github.event_name == 'workflow_dispatch' && inputs.commit_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "EXPECTED_SHA=${main_sha}" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing HappyFox deploy host}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing production secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_USER:?Missing HappyFox deploy user}"
          : "${DEPLOY_PORT:?Missing HappyFox deploy port}"
          : "${DEPLOY_PATH:?Missing HappyFox deploy path}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "EXPECTED_SHA must be a full 40-character SHA" >&2
            exit 1
          }

      - name: Check out exact deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify dedicated-host release files
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Bambale0/banano_kling' MIGRATION_SOURCE.md
          grep -Fq 'HappyFox' MIGRATION_SOURCE.md
          grep -Fq 'PRODUCT_ID: happyfox' compose.backend.yml
          test -s compose.infra.yml
          test -s scripts/deploy_happyfox_dedicated.sh
          test -s scripts/ensure_telegram_webhook.py
          chmod +x scripts/deploy_happyfox_dedicated.sh

      - name: Configure pinned SSH for dedicated host
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          scan="$(ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 -T 10 "$DEPLOY_HOST" 2>/dev/null)"
          : "${scan:?Could not scan HappyFox SSH host key}"
          actual_fingerprint="$(printf '%s\n' "$scan" | ssh-keygen -lf - | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$EXPECTED_HOST_FINGERPRINT" ]; then
            echo "HappyFox SSH host key mismatch" >&2
            exit 1
          fi
          printf '%s\n' "$scan" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Prepare exact main checkout on HappyFox host
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          printf -v quoted_sha '%q' "$EXPECTED_SHA"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_path $quoted_sha" <<'REMOTE'
          set -Eeuo pipefail
          project_dir="$1"
          expected_sha="$2"
          cd "$project_dir"
          test -d .git
          test -f .env
          test -f .env.happyfox.channels
          git fetch --prune origin main
          [ "$(git rev-parse origin/main)" = "$expected_sha" ]
          git switch main
          git reset --hard "$expected_sha"
          [ "$(git rev-parse HEAD)" = "$expected_sha" ]
          REMOTE

      - name: Sync protected HappyFox runtime overlay
        if: env.HAPPYFOX_RUNTIME_ENV != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp_env="$(mktemp)"
          trap 'rm -f "$tmp_env"' EXIT
          printf '%s\n' "$HAPPYFOX_RUNTIME_ENV" > "$tmp_env"
          chmod 0600 "$tmp_env"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$tmp_env" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.happyfox.runtime"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_PATH/.env.happyfox.runtime'"

      - name: Deploy exact HappyFox commit to dedicated host
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          printf -v quoted_sha '%q' "$EXPECTED_SHA"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_path $quoted_sha" <<'REMOTE'
          set -Eeuo pipefail
          project_dir="$1"
          expected_sha="$2"
          cd "$project_dir"
          chmod +x scripts/deploy_happyfox_dedicated.sh
          env \
            HAPPYFOX_API_ORIGIN=https://api.happy-fox.online \
            HAPPYFOX_APP_ORIGIN=https://app.happy-fox.online \
            HAPPYFOX_LANDING_ORIGIN=https://happy-fox.online \
            HAPPYFOX_DATABASE_NAME=happyfox_cutover \
            bash scripts/deploy_happyfox_dedicated.sh "$expected_sha"
          REMOTE

      - name: Verify public production revision
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            https://api.happy-fox.online/health >/dev/null
          revision="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            "https://app.happy-fox.online/mini-app/revision.txt?revision=${EXPECTED_SHA}")"
          [ "$revision" = "$EXPECTED_SHA" ]
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            https://happy-fox.online/ >/dev/null

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo '## HappyFox dedicated production deployment'
            echo
            echo "- Commit: \`${EXPECTED_SHA}\`"
            echo "- Host: \`${DEPLOY_HOST}\`"
            echo "- Checkout: \`${DEPLOY_PATH}\`"
            echo '- API/webhooks: `https://api.happy-fox.online`'
            echo '- Mini App: `https://app.happy-fox.online/mini-app/`'
            echo '- Landing: `https://happy-fox.online/`'
            echo '- Telegram webhook and MAX subscription are reconciled by the deploy gate.'
          } >> "$GITHUB_STEP_SUMMARY"
