name: Deploy HappyFox production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main SHA to deploy; leave empty for current main
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: happyfox-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified HappyFox main SHA
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/foxgen' }}
      MINIAPP_FRONTEND_DOMAIN: ${{ vars.MINIAPP_FRONTEND_DOMAIN }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}

    steps:
      - name: Resolve manual main SHA
        if: github.event_name == 'workflow_dispatch' && inputs.commit_sha == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "EXPECTED_SHA=${main_sha}" >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing production secret DEPLOY_HOST}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Missing production secret DEPLOY_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing production secret DEPLOY_KNOWN_HOSTS}"
          : "${DEPLOY_USER:?Missing production variable DEPLOY_USER}"
          : "${DEPLOY_PORT:?Missing production variable DEPLOY_PORT}"
          : "${DEPLOY_PATH:?Missing production variable DEPLOY_PATH}"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "EXPECTED_SHA must be a full 40-character SHA" >&2
            exit 1
          }

      - name: Check out exact deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1

      - name: Verify repository provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Bambale0/banano_kling' MIGRATION_SOURCE.md
          grep -Fq '36f92a0504f849c0c591652a880410e33a1c89aa' MIGRATION_SOURCE.md
          grep -Fq 'HappyFox' MIGRATION_SOURCE.md
          grep -Fq 'PRODUCT_ID: happyfox' compose.backend.yml
          test -x scripts/deploy_happyfox.sh || chmod +x scripts/deploy_happyfox.sh
          test -x scripts/deploy_happyfox_miniapp.sh || chmod +x scripts/deploy_happyfox_miniapp.sh

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Resolve HappyFox Mini App domain
        shell: bash
        run: |
          set -Eeuo pipefail

          normalize_domain() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse

          value = sys.argv[1].strip()
          if not value:
              raise SystemExit("HappyFox Mini App domain is empty")

          parsed = urlparse(value if "://" in value else f"//{value}")
          host = (parsed.hostname or "").strip().rstrip(".")
          if not host or not re.fullmatch(r"[A-Za-z0-9.-]+", host):
              raise SystemExit("Could not parse a valid HappyFox Mini App hostname")
          print(host)
          PY
          }

          resolved_domain="${MINIAPP_FRONTEND_DOMAIN:-}"
          resolver_source="github-environment:MINIAPP_FRONTEND_DOMAIN"
          if [ -z "$resolved_domain" ]; then
            printf -v quoted_path '%q' "$DEPLOY_PATH"
            resolver_output="$(
              ssh \
                -i "$HOME/.ssh/id_ed25519" \
                -p "$DEPLOY_PORT" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=15 \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "python3 - $quoted_path" <<'PY'
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          project_dir = Path(sys.argv[1])

          def parse_env(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              if not path.is_file():
                  return values
              for raw_line in path.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  if line.startswith("export "):
                      line = line[7:].lstrip()
                  if "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                      value = value[1:-1]
                  values[key.strip()] = value
              return values

          def extract_hostname(value: str) -> str:
              value = value.strip()
              if not value:
                  return ""
              parsed = urlparse(value if "://" in value else f"//{value}")
              host = (parsed.hostname or "").strip().rstrip(".")
              if not host or not re.fullmatch(r"[A-Za-z0-9.-]+", host):
                  return ""
              return host

          sources = (
              project_dir / ".env.happyfox.runtime",
              project_dir / ".env",
              project_dir / "backups" / "pre-happyfox" / "legacy.env.initial",
          )
          keys = (
              "MINIAPP_FRONTEND_DOMAIN",
              "MINI_APP_URL",
              "FOXGEN_MINIAPP_PUBLIC_URL",
              "FOXGEN_KIE_CALLBACK_BASE_URL",
              "WEBHOOK_HOST",
              "STATIC_BASE_URL",
          )

          for path in sources:
              values = parse_env(path)
              for key in keys:
                  host = extract_hostname(values.get(key, ""))
                  if host:
                      print(f"__HAPPYFOX_MINIAPP_DOMAIN__={host}")
                      print(f"__HAPPYFOX_MINIAPP_SOURCE__={path.name}:{key}")
                      raise SystemExit(0)

          raise SystemExit(
              "Could not resolve HappyFox Mini App domain from runtime or fallback env files"
          )
          PY
            )"

            resolved_domain="$(
              printf '%s\n' "$resolver_output" \
                | sed -n 's/^__HAPPYFOX_MINIAPP_DOMAIN__=//p' \
                | tail -n 1
            )"
            resolver_source="$(
              printf '%s\n' "$resolver_output" \
                | sed -n 's/^__HAPPYFOX_MINIAPP_SOURCE__=//p' \
                | tail -n 1
            )"
          fi

          : "${resolved_domain:?Unable to resolve HappyFox Mini App domain}"
          resolved_domain="$(normalize_domain "$resolved_domain")"

          case "${resolved_domain,,}" in
            *tanyapi.chillcreative.ru*|*cdn.chillcreative.ru*|*media.chillcreative.ru*|*tanyapp*|*neuromix*|*only_tany*)
              echo "Refusing NEUROMIX/Tanya Mini App domain" >&2
              exit 1
              ;;
          esac

          echo "Resolved HappyFox Mini App domain: ${resolved_domain} (${resolver_source:-unknown source})"
          echo "MINIAPP_FRONTEND_DOMAIN=${resolved_domain}" >> "$GITHUB_ENV"

      - name: Preflight isolated HappyFox runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          printf -v quoted_sha '%q' "$EXPECTED_SHA"
          printf -v quoted_domain '%q' "$MINIAPP_FRONTEND_DOMAIN"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_path $quoted_sha $quoted_domain" <<'REMOTE'
          set -Eeuo pipefail
          PROJECT_DIR="$1"
          EXPECTED_SHA="$2"
          MINIAPP_FRONTEND_DOMAIN="$3"

          cd "$PROJECT_DIR"
          test -d .git
          test -f .env
          git update-index -q --refresh || true
          git diff --quiet
          git diff --cached --quiet
          git fetch --prune origin main
          [ "$(git rev-parse origin/main)" = "$EXPECTED_SHA" ]

          git show "${EXPECTED_SHA}:MIGRATION_SOURCE.md" | grep -Fq '36f92a0504f849c0c591652a880410e33a1c89aa'

          git switch main
          git reset --hard "$EXPECTED_SHA"
          export PRODUCT_ID=happyfox
          export REDIS_PREFIX="${REDIS_PREFIX:-foxgen_happyfox}"
          export HAPPYFOX_BACKEND_NETWORK="${HAPPYFOX_BACKEND_NETWORK:-foxgen_backend}"
          export HAPPYFOX_PUBLIC_ORIGIN="https://${MINIAPP_FRONTEND_DOMAIN}"

          docker network inspect "$HAPPYFOX_BACKEND_NETWORK" >/dev/null
          python3 scripts/report_happyfox_production_topology.py .env
          python3 scripts/prepare_happyfox_production.py "$PROJECT_DIR"
          python3 scripts/validate_happyfox_env.py \
            .env .env.happyfox.runtime .env.postgres

          case "${MINIAPP_FRONTEND_DOMAIN,,}" in
            *tanyapi.chillcreative.ru*|*cdn.chillcreative.ru*|*media.chillcreative.ru*|*tanyapp*|*neuromix*|*only_tany*) exit 1 ;;
          esac
          REMOTE

      - name: Deploy exact HappyFox commit
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          printf -v quoted_sha '%q' "$EXPECTED_SHA"
          printf -v quoted_domain '%q' "$MINIAPP_FRONTEND_DOMAIN"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_path $quoted_sha $quoted_domain" <<'REMOTE'
          set -Eeuo pipefail
          PROJECT_DIR="$1"
          EXPECTED_SHA="$2"
          MINIAPP_FRONTEND_DOMAIN="$3"
          cd "$PROJECT_DIR"

          run_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n "$@"
            fi
          }

          chmod +x scripts/deploy_happyfox.sh scripts/deploy_happyfox_miniapp.sh
          run_root env \
            PROJECT_DIR="$PROJECT_DIR" \
            PRODUCT_ID=happyfox \
            REDIS_PREFIX=foxgen_happyfox \
            HAPPYFOX_BACKEND_NETWORK=foxgen_backend \
            HAPPYFOX_PUBLIC_ORIGIN="https://${MINIAPP_FRONTEND_DOMAIN}" \
            bash scripts/deploy_happyfox.sh deploy

          run_root env \
            MINIAPP_FRONTEND_DOMAIN="$MINIAPP_FRONTEND_DOMAIN" \
            PRODUCT_ID=happyfox \
            NEXT_PUBLIC_PRODUCT_ID=happyfox \
            bash scripts/deploy_happyfox_miniapp.sh "$EXPECTED_SHA"

          health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' foxgen-happyfox-bot)"
          revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' foxgen-happyfox-bot)"
          [ "$health" = healthy ]
          [ "$revision" = "$EXPECTED_SHA" ]

          live_revision="$(curl -fsS --max-time 20 "https://${MINIAPP_FRONTEND_DOMAIN}/mini-app/revision.txt?revision=${EXPECTED_SHA}")"
          [ "$live_revision" = "$EXPECTED_SHA" ]
          REMOTE

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo '## HappyFox production deployment'
            echo
            echo "- Commit: \`${EXPECTED_SHA}\`"
            echo "- Backend checkout: \`${DEPLOY_PATH}\`"
            echo "- Mini App: \`https://${MINIAPP_FRONTEND_DOMAIN}/mini-app/\`"
            echo '- Database: isolated `happyfox` database on the established PostgreSQL service'
            echo '- Redis: isolated logical DB plus `foxgen_happyfox` namespace'
            echo '- Source core: `banano_kling/tanyapi@36f92a0504f849c0c591652a880410e33a1c89aa`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          state=failure
          description='HappyFox production deployment failed'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='HappyFox production deployment succeeded'
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            -f state="$state" \
            -f context='foxgen/production-deploy' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
