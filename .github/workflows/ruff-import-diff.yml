name: Ruff import diff

on:
  push:
    branches:
      - fix/happyfox-public-backend-route

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: python -m ruff check tests/test_happyfox_reverse_proxy.py --fix --diff || true
