[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "happyfox-neironych"
version = "0.1.0"
description = "Shared HappyFox Neironych partner API contracts and client"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "Pillow>=11.1"]

[tool.setuptools.packages.find]
include = ["happyfox_neironych*"]
exclude = ["bot*", "tests*", "data*"]
