services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foxgen
      POSTGRES_USER: foxgen
      POSTGRES_PASSWORD: foxgen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxgen -d foxgen"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: foxgen
      MINIO_ROOT_PASSWORD: foxgen-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    build: .
    image: foxgen:local
    command: ["python", "scripts/configure_minio_input_lifecycle.py"]
    environment:
      FOXGEN_S3_ENDPOINT_URL: http://minio:9000
      FOXGEN_S3_ACCESS_KEY_ID: foxgen
      FOXGEN_S3_SECRET_ACCESS_KEY: foxgen-development-secret
      FOXGEN_S3_BUCKET: foxgen-media
      FOXGEN_S3_REGION: us-east-1
      FOXGEN_INPUT_RETENTION_DAYS: ${FOXGEN_INPUT_RETENTION_DAYS:-2}
      FOXGEN_INPUT_MULTIPART_ABORT_DAYS: ${FOXGEN_INPUT_MULTIPART_ABORT_DAYS:-1}
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    command: ["foxgen-api"]
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    env_file: .env
    command: ["foxgen-worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  bot:
    build: .
    env_file: .env
    command: ["foxgen-bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
