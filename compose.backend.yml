name: ${COMPOSE_PROJECT_NAME:-banano-kling}

services:
  bot:
    image: ${BANANO_IMAGE:-banano-kling-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
    container_name: ${CONTAINER_NAME:-banano-kling-bot}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - path: .env
        required: true
      - path: .env.postgres
        required: false

    environment:
      BANANO_SKIP_PROJECT_ENV: "1"
      BANANO_LOG_TO_STDOUT: "1"
      WEBHOOK_BIND_HOST: "127.0.0.1"
      WEBHOOK_PORT: ${WEBHOOK_PORT:-1888}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/bot.db}
      MINI_APP_URL: ${MINI_APP_URL:-https://cdn.chillcreative.ru/mini-app/}

    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./outputs:/app/outputs

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536
