name: ${COMPOSE_PROJECT_NAME:-foxgen-happyfox}

services:
  bot:
    image: ${HAPPYFOX_IMAGE:-foxgen-happyfox-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-local}
    container_name: ${CONTAINER_NAME:-foxgen-happyfox-bot}
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - path: .env
        required: true
      - path: .env.happyfox.runtime
        required: true
      - path: .env.postgres
        required: false

    environment:
      PRODUCT_ID: happyfox
      BANANO_SKIP_PROJECT_ENV: "1"
      BANANO_LOG_TO_STDOUT: "1"
      WEBHOOK_BIND_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8080"
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/bot.db}

    ports:
      - "127.0.0.1:${HAPPYFOX_HOST_PORT:-1888}:8080"

    networks:
      legacy_backend:
        aliases:
          - api
          - foxgen-api
          - foxgen-api-1

    volumes:
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./outputs:/app/outputs

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  legacy_backend:
    external: true
    name: ${HAPPYFOX_BACKEND_NETWORK:-foxgen_backend}
