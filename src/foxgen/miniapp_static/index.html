<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Happy Fox — AI-студия, каталог моделей, генерации, работы и творческий профиль прямо в Telegram">
  <meta name="foxgen-miniapp-shell" content="parity-v7">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Happy Fox</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="/mini-app/app.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/studio.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/parity.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/complete-menu.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/motion-control.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/promo-redeem.css?v=parity-v7">
  <link rel="stylesheet" href="/mini-app/product-home.css?v=parity-v7">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <main class="boot-screen">
      <div class="brand-lockup brand-lockup--center">
        <div class="fox-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M8 10 23 18 32 12l9 6 15-8-4 27-20 17L12 37 8 10Z" fill="currentColor"/>
            <path d="m19 27 9 5-6 4-3-9Zm26 0-9 5 6 4 3-9Z" fill="#090909"/>
            <path d="m25 40 7 4 7-4-7 10-7-10Z" fill="#090909"/>
          </svg>
        </div>
        <div>
          <strong>Happy <span>Fox</span></strong>
          <small>AI-студия в Telegram</small>
        </div>
      </div>
      <div class="boot-orbit" aria-hidden="true"></div>
      <div class="boot-spinner" aria-label="Загрузка"></div>
      <p id="boot-message">Подготавливаем Happy Fox…</p>
    </main>
  </div>
  <input id="media-picker" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,audio/mpeg,audio/mp4,audio/wav">

  <div
    id="foxgen-runtime-manifest"
    hidden
    data-parity-src="/mini-app/parity-app.js?v=parity-v7"
    data-legacy-src="/mini-app/app.js?v=parity-v7"
  ></div>
  <div id="foxgen-enhancement-manifest" hidden>
    <span data-module-src="/mini-app/complete-menu.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/user-parity-hardening.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/user-parity-phase2.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/user-draft-recovery.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/tts-parity.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/suno-parity.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/suno-extend.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/suno-upload-cover.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/suno-upload-extend.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/motion-control.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/promo-redeem.js?v=parity-v7"></span>
    <span data-module-src="/mini-app/product-home.js?v=parity-v7"></span>
  </div>

  <script src="/mini-app/boot-guard.js?v=parity-v7"></script>
  <script src="/mini-app/runtime-loader.js?v=parity-v7"></script>
  <script src="/mini-app/enhancement-loader.js?v=parity-v7"></script>
</body>
</html>
