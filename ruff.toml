# Seedance 2.5 and channel/provider adapters are isolated compatibility layers
# around existing Mini App / Telegram / MAX / webhook seams. Keep exceptions
# local to those adapters; changed-file linting remains strict everywhere else.

[lint.per-file-ignores]
"bot/handlers/__init__.py" = ["I001"]
"bot/services/partner_approval_service.py" = ["SIM117"]
"bot/handlers/seedance_25_fullstack.py" = [
  "BLE001",
  "F841",
  "I001",
  "PIE810",
  "S110",
  "SIM115",
  "SIM117",
  "UP035",
]
"bot/handlers/seedance_25_chunk_upload.py" = ["BLE001"]
"bot/handlers/seedance_25_public_release.py" = ["BLE001", "I001", "S110"]

# Suno upload/delivery fallbacks intentionally normalize exceptions raised by
# Telegram/MAX/provider transports into creator-facing errors and refunds.
"bot/handlers/suno.py" = ["BLE001"]
"bot/suno_jobs.py" = ["BLE001", "I001"]
# These provider constants are immutable by convention and nested aiohttp
# contexts are kept explicit so response lifetime is visually obvious.
"bot/services/suno_service.py" = ["RUF012", "SIM117"]
"bot/services/suno_upload_service.py" = ["SIM117"]
# MAX channel is layered over the existing Omni runtime; the imported menu is
# retained as a compatibility symbol for downstream composition.
"bot/max_suno_channel.py" = ["F401"]
"bot/max_suno_full_channel.py" = ["I001"]

"scripts/report_happyfox_production_topology.py" = ["I001"]
