# Reference Nginx server block for media.chillcreative.ru.
# The deployment script mounts the existing backend directory
# /root/tanya/banano_kling/static/uploads at:
# /var/www/media.chillcreative.ru/uploads

server {
    listen 80;
    server_name media.chillcreative.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name media.chillcreative.ru;

    ssl_certificate /etc/letsencrypt/live/media.chillcreative.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.chillcreative.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MEDIA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    etag on;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    # Durable public feed and thumbnails. Filenames are content-unique/UUID-based.
    location /uploads/feed/ {
        alias /var/www/media.chillcreative.ru/uploads/feed/;
        limit_except GET HEAD { deny all; }

        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
        log_not_found off;
    }

    # References and temporary uploads must not be retained by edge/browser caches.
    location /uploads/ {
        alias /var/www/media.chillcreative.ru/uploads/;
        limit_except GET HEAD { deny all; }

        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
        log_not_found off;
    }

    location / {
        return 404;
    }
}
